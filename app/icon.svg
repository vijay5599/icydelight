<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF8A73" />
    </linearGradient>
    <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6A862" />
      <stop offset="100%" stop-color="#D97724" />
    </linearGradient>
    <linearGradient id="scoop1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>
    <linearGradient id="scoop2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5E85" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Cone -->
  <path d="M22 36 L42 36 L32 54 Z" fill="url(#coneGrad)" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Cone Crosshatch Lines -->
  <line x1="26" y1="41" x2="38" y2="41" stroke="#B45309" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  <line x1="29" y1="46" x2="35" y2="46" stroke="#B45309" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  <line x1="27" y1="36" x2="35" y2="50" stroke="#B45309" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  <line x1="37" y1="36" x2="29" y2="50" stroke="#B45309" stroke-width="1" stroke-linecap="round" opacity="0.6" />

  <!-- Lower Strawberry Scoop -->
  <path d="M19 36 C19 28 45 28 45 36 C45 38 43 39 40 39 C37 39 36 38 34 38 C32 38 31 39 28 39 C25 39 24 38 22 38 C20 38 19 37 19 36 Z" fill="url(#scoop2)" />

  <!-- Upper Vanilla Swirl Scoop -->
  <path d="M22 28 C22 20 42 20 42 28 C42 31 39 32 36 32 C34 32 33 31 32 31 C31 31 30 32 28 32 C25 32 22 30 22 28 Z" fill="url(#scoop1)" />

  <!-- Cream Swirl Top -->
  <path d="M32 12 C33 12 35 15 35 18 C35 19 33 21 32 21 C31 21 29 19 29 18 C29 15 31 12 32 12 Z" fill="#FFFFFF" />

  <!-- Cherry on Top -->
  <circle cx="32" cy="14" r="3.5" fill="#DC2626" />
  <path d="M33 13 C35 9 39 9 40 8" stroke="#7F1D1D" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Sprinkles -->
  <rect x="25" y="24" width="2" height="4" rx="1" fill="#FFD700" transform="rotate(30 25 24)" />
  <rect x="36" y="25" width="2" height="4" rx="1" fill="#00E5FF" transform="rotate(-20 36 25)" />
  <rect x="30" y="26" width="2" height="4" rx="1" fill="#FF4081" transform="rotate(45 30 26)" />
</svg>
